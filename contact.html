<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — EvaMariaDreams</title>
  <meta name="description" content="Contact EvaMariaDreams for studio inquiries, product questions, and support.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f5f5f7;
      --surface:#ffffff;
      --text:#1d1d1f;
      --muted:#6e6e73;
      --line:#d2d2d7;
      --primary:#0071e3;
      --primary-hover:#0077ed;
      --shadow:0 20px 60px rgba(0,0,0,0.06);
      --max:1180px;
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:"Inter",sans-serif;
      color:var(--text);
      background:var(--bg);
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    a{text-decoration:none;color:inherit}

    .topbar{
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(245,245,247,0.86);
      backdrop-filter:saturate(180%) blur(18px);
      border-bottom:1px solid rgba(0,0,0,0.06);
    }

    .container{
      width:min(var(--max), calc(100% - 44px));
      margin:0 auto;
    }

    .nav{
      min-height:64px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .brand{
      font-size:18px;
      font-weight:600;
      letter-spacing:-0.02em;
    }

    .back{
      font-size:14px;
      color:var(--muted);
      font-weight:500;
    }

    .hero{
      min-height:calc(100vh - 64px);
      display:flex;
      align-items:center;
      padding:64px 0 88px;
    }

    .panel{
      width:min(100%, 980px);
      margin:0 auto;
      background:var(--surface);
      border-radius:32px;
      box-shadow:var(--shadow);
      padding:72px 72px 64px;
    }

    .eyebrow{
      margin:0 0 16px 0;
      font-size:12px;
      line-height:1;
      letter-spacing:0.12em;
      text-transform:uppercase;
      color:var(--muted);
      font-weight:700;
    }

    h1{
      margin:0;
      font-size:clamp(48px, 7vw, 80px);
      line-height:1.02;
      letter-spacing:-0.05em;
      font-weight:700;
      max-width:10ch;
    }

    .lead{
      margin:24px 0 0 0;
      max-width:660px;
      font-size:21px;
      line-height:1.52;
      letter-spacing:-0.01em;
      color:var(--muted);
      font-weight:400;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:14px;
      margin-top:34px;
    }

    .button{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:52px;
      padding:0 22px;
      border-radius:999px;
      font-size:17px;
      font-weight:600;
      transition:all .2s ease;
      border:1px solid transparent;
    }

    .button-primary{
      background:var(--primary);
      color:#fff;
    }

    .button-primary:hover{
      background:var(--primary-hover);
    }

    .button-secondary{
      background:#fff;
      color:var(--primary);
      border-color:var(--line);
    }

    .meta{
      margin-top:26px;
      font-size:15px;
      line-height:1.55;
      color:var(--muted);
    }

    @media (max-width: 820px){
      .container{
        width:min(var(--max), calc(100% - 28px));
      }

      .hero{
        align-items:flex-start;
        padding:28px 0 44px;
        min-height:auto;
      }

      .panel{
        padding:38px 24px 32px;
        border-radius:24px;
      }

      h1{
        font-size:clamp(38px, 12vw, 52px);
      }

      .lead{
        font-size:17px;
        line-height:1.6;
      }

      .button{
        width:100%;
        font-size:16px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="index.html">EvaMariaDreams</a>
      <a class="back" href="index.html">Back to home</a>
    </div>
  </header>

  <main class="hero">
    <div class="container">
      <section class="panel">
        <p class="eyebrow">Contact</p>
        <h1>Get in touch.</h1>

        <p class="lead">
          For studio inquiries, product questions, collaborations, or support for Octi Flow, contact us by email.
        </p>

        <div class="actions">
          <a class="button button-primary" href="mailto:anansi2018@gmail.com?subject=EvaMariaDreams%20Inquiry">Contact us</a>
          <a class="button button-secondary" href="support.html">Get support</a>
        </div>

        <p class="meta">
          For app-related help, you can also visit the support page.
        </p>
      </section>
    </div>
  </main>
</body>
</html>
